<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таблица умножения (теория)</title>
    <link rel="stylesheet" type="text/css" href="./styles.build.css" />
  </head>
  <body class="min-h-screen font-sans text-slate-100 bg-gradient-to-b from-slate-900 via-slate-900 to-indigo-950">
    <main class="max-w-4xl px-4 py-6 mx-auto sm:px-6">
      <div id="main-menu"></div>
      <h1 class="mb-6 text-3xl font-extrabold text-center text-amber-300">📖 Таблица умножения (теория)</h1>
      <div class="p-4 overflow-x-auto rounded-2xl bg-slate-800/60">
        <table class="w-full overflow-hidden border-collapse rounded-lg">
          <caption class="mb-3 text-lg font-bold text-center caption-top text-slate-200">Таблица умножения от 1 до 10</caption>
          <tbody id="mult-table-body">
            <!-- JS will fill rows here -->
          </tbody>
        </table>
      </div>
    </main>
    <script type="module">
      import { renderMenu } from './js/menu.js';
      renderMenu();
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const tableBody = document.getElementById('mult-table-body');
        for (let row = 1; row <= 10; row++) {
          const tr = document.createElement('tr');
          tr.className = row % 2 === 0 ? 'bg-slate-900/40' : '';
          for (let col = 1; col <= 10; col++) {
            const a = row;
            const b = col;
            const td = document.createElement('td');
            td.className = 'border border-slate-700/60 px-3 py-2 text-center text-slate-100 font-semibold hover:bg-indigo-600/40 transition-colors duration-150';
            td.textContent = `${a} x ${b} = ${a * b}`;
            tr.appendChild(td);
          }
          tableBody.appendChild(tr);
        }
      });
    </script>
  </body>
</html>
