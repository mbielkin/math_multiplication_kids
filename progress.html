<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой прогресс</title>
    <link rel="stylesheet" type="text/css" href="./styles.build.css" />
  </head>
  <body class="min-h-screen font-sans text-slate-100 bg-gradient-to-b from-slate-900 via-slate-900 to-indigo-950">
    <main class="max-w-4xl px-4 py-6 mx-auto sm:px-6">
      <div id="main-menu"></div>
      <h1 class="mb-6 text-3xl font-extrabold text-center text-emerald-300">⭐ Мой прогресс</h1>
      <div id="progress-content" class="flex flex-col max-w-2xl gap-4 mx-auto"></div>
      <div class="mt-8 text-center">
        <button
          id="reset-progress"
          type="button"
          class="px-6 py-3 text-lg font-extrabold text-white bg-rose-600 rounded-full shadow-md hover:bg-rose-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200"
        >
          🗑️ Сбросить прогресс
        </button>
      </div>
    </main>
    <script type="module">
      import { renderMenu } from './js/menu.js';
      renderMenu();
    </script>
    <script src="js/progress-page.js" type="module"></script>
  </body>
</html>
